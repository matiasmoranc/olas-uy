# Sube a Supabase la base de datos (migraciones) y las funciones del servidor cada vez que cambian.
# Necesita estos "secrets" del repositorio (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD
# y, para las funciones: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_PUBLIC_URL,
#   MP_CLIENT_ID, MP_CLIENT_SECRET, MP_STATE_SECRET, MP_WEBHOOK_SECRET (opcional),
#   RESEND_API_KEY y EMAIL_FROM (opcionales: mail al comprador con el link de descarga)
#   ADMIN_EMAILS (mails que pueden entrar al panel #admin, separados por coma)
# Si todavía no están cargados, el trabajo termina sin hacer nada (no falla).
name: Servidor (Supabase)

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Revisar configuración
        id: check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Faltan los secrets de Supabase: no se sube nada todavía."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: latest

      - name: Conectar con el proyecto
        if: steps.check.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Base de datos (migraciones)
        if: steps.check.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --remote --yes --password "$SUPABASE_DB_PASSWORD"

      - name: Administradores del panel (#admin)
        if: steps.check.outputs.ready == 'true'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: |
          if [ -z "$ADMIN_EMAILS" ]; then echo "Sin ADMIN_EMAILS: no se cambian los administradores."; exit 0; fi
          node - <<'JS'
          const emails = process.env.ADMIN_EMAILS.split(/[,\s]+/).map((e) => e.trim().toLowerCase()).filter((e) => /^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/.test(e));
          if (!emails.length) { console.error("ADMIN_EMAILS no tiene mails válidos"); process.exit(1); }
          const q = `begin; delete from public.admins; insert into public.admins(email) values ${emails.map((e) => `('${e}')`).join(",")}; commit;`;
          (async () => {
            const r = await fetch(`https://api.supabase.com/v1/projects/${process.env.SUPABASE_PROJECT_REF}/database/query`, {
              method: "POST",
              headers: { Authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`, "Content-Type": "application/json" },
              body: JSON.stringify({ query: q }),
            });
            if (!r.ok) { console.error("Supabase respondió", r.status, await r.text()); process.exit(1); }
            console.log(`Listo: ${emails.length} administrador(es).`);
            // Chequeo sin mostrar mails (los logs son públicos)
            const chk = `select (select count(*) from public.admins) as admins,
              (select count(*) from public.admins a where exists (select 1 from auth.users u where lower(u.email) = a.email)) as con_cuenta,
              (select r.rolname || ' bypassrls=' || r.rolbypassrls || ' super=' || r.rolsuper from pg_proc p join pg_roles r on r.oid = p.proowner where p.proname = 'is_admin') as duenio_is_admin`;
            const c = await fetch(`https://api.supabase.com/v1/projects/${process.env.SUPABASE_PROJECT_REF}/database/query`, {
              method: "POST",
              headers: { Authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`, "Content-Type": "application/json" },
              body: JSON.stringify({ query: chk }),
            });
            console.log("Chequeo:", c.status, await c.text());
          })();
          JS

      - name: Claves de las funciones
        if: steps.check.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          MP_CLIENT_ID: ${{ secrets.MP_CLIENT_ID }}
          MP_CLIENT_SECRET: ${{ secrets.MP_CLIENT_SECRET }}
          MP_STATE_SECRET: ${{ secrets.MP_STATE_SECRET }}
          MP_WEBHOOK_SECRET: ${{ secrets.MP_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          args=()
          for k in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_PUBLIC_URL MP_CLIENT_ID MP_CLIENT_SECRET MP_STATE_SECRET MP_WEBHOOK_SECRET RESEND_API_KEY EMAIL_FROM; do
            if [ -n "${!k}" ]; then args+=("$k=${!k}"); fi
          done
          if [ ${#args[@]} -gt 0 ]; then supabase secrets set --yes --remote="$SUPABASE_PROJECT_REF" "${args[@]}"; fi

      - name: Funciones
        if: steps.check.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase functions deploy --yes --remote="$SUPABASE_PROJECT_REF"
